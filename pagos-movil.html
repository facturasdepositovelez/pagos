<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Registro de Pagos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  --bg:        #F4F6F8;
  --surface:   #FFFFFF;
  --border:    #E4E7EC;
  --border-s:  #D0D5DD;
  --fg:        #101828;
  --muted:     #667085;
  --accent:    #1D4ED8;
  --accent-h:  #1E40AF;
  --danger:    #B91C1C;
  --ok:        #15803D;
  --warn:      #B45309;
  --chip-tr:   #EFF6FF;
  --chip-tr-fg:#1D4ED8;
  --chip-ec:   #FFFBEB;
  --chip-ec-fg:#92400E;
  --radius:    8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0F1117;--surface:#181C25;--border:#262C3A;--border-s:#303748;
    --fg:#E9ECF2;--muted:#7C849A;--accent:#3B82F6;--accent-h:#60A5FA;
    --danger:#F87171;--ok:#4ADE80;--warn:#FCD34D;
    --chip-tr:#172554;--chip-tr-fg:#93C5FD;--chip-ec:#431407;--chip-ec-fg:#FCD34D;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  line-height: 1.45;
  padding-left:  max(12px, env(safe-area-inset-left,  0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}

/* ── layout ── */
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}
.header-title { display: flex; align-items: center; gap: 7px; }
.header-title h1 { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ── card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.card-head {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .3px;
}
.card-body { padding: 12px 14px; }

/* ── form ── */
.form-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 3px; flex: 1 1 160px; min-width: 0; }
.field.field-sm { flex: 0 1 120px; }
label { font-size: 11px; font-weight: 500; color: var(--muted); }
input, select {
  border: 1px solid var(--border-s);
  border-radius: 6px;
  padding: 6px 10px;
  font: inherit;
  font-size: 13px;
  background: var(--bg);
  color: var(--fg);
  outline: none;
  transition: border-color .12s;
  width: 100%;
}
input::placeholder { color: var(--muted); opacity: .7; }
input:focus, select:focus { border-color: var(--accent); }
input[type="number"] { font-variant-numeric: tabular-nums; }

/* tipo selector */
.tipo-group { display: flex; gap: 6px; }
.tipo-btn {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border-s);
  border-radius: 6px;
  background: var(--bg);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.tipo-btn.active.tr { border-color: var(--accent); background: var(--chip-tr); color: var(--chip-tr-fg); font-weight: 600; }
.tipo-btn.active.ec { border-color: var(--warn); background: var(--chip-ec); color: var(--chip-ec-fg); font-weight: 600; }

/* echeq extra */
.echeq-fields {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  background: var(--chip-ec);
  border: 1px solid #F59E0B33;
  border-radius: 6px;
}
.echeq-fields.visible { display: flex; }
.echeq-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--chip-ec-fg);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ── botones ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 6px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .12s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }
.btn-primary:active { opacity: .85; }
.btn-export { background: var(--ok); color: #fff; }
.btn-export:hover { filter: brightness(1.08); }
.btn-pdf { background: #DC2626; color: #fff; }
.btn-pdf:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: default; }

/* cliente activo */
.cliente-activo {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--chip-tr);
  color: var(--chip-tr-fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 6px 10px;
  font-weight: 600;
  font-size: 13px;
}
.btn-cambiar-cliente {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 4px;
  color: inherit;
  font: inherit;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  cursor: pointer;
  opacity: .65;
  transition: opacity .12s;
}
.btn-cambiar-cliente:hover { opacity: 1; }

/* fecha global */
.fecha-global {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border: 1px solid var(--border-s);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--muted);
}
.fecha-global input[type="date"] {
  border: none; background: transparent; padding: 0;
  color: var(--fg); font-size: 12px; font-weight: 600; width: auto;
}
.fecha-global input[type="date"]:focus { outline: none; }

/* ── lista ── */
.pagos-list { display: flex; flex-direction: column; }
.cliente-group { border-bottom: 1px solid var(--border); }
.cliente-group:last-child { border-bottom: none; }
.cliente-header {
  padding: 7px 14px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.cliente-header:hover { background: var(--border); }
.chevron { color: var(--muted); transition: transform .18s; flex-shrink: 0; }
.cliente-group.open .chevron { transform: rotate(90deg); }
.cliente-pagos { display: none; }
.cliente-group.open .cliente-pagos { display: block; }
.cliente-name {
  font-weight: 700;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--fg);
}
.cliente-total {
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.pago-row {
  padding: 5px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 6px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
}
.chip-tr { background: var(--chip-tr); color: var(--chip-tr-fg); }
.chip-ec { background: var(--chip-ec); color: var(--chip-ec-fg); }
.pago-monto {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 13px;
  margin-left: auto;
}
.pago-meta { color: var(--muted); font-size: 11px; flex: 1 1 100px; min-width: 0; line-height: 1.3; }
.pago-meta span { display: block; }
.delete-btn {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  padding: 3px; border-radius: 4px;
  line-height: 1; flex-shrink: 0;
  opacity: .4; transition: all .12s;
}
.delete-btn:hover { opacity: 1; color: var(--danger); }

/* ── total general ── */
.total-bar {
  padding: 10px 14px;
  background: var(--accent);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: #fff;
  margin: 10px;
}
.total-bar-label { font-size: 11px; font-weight: 600; opacity: .8; }
.total-bar-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ── vacío ── */
.empty { padding: 28px 14px; text-align: center; color: var(--muted); }
.empty svg { opacity: .25; margin-bottom: 8px; }
.empty p { font-size: 12px; line-height: 1.5; }

/* ── toast ── */
.toast {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--fg); color: var(--bg);
  padding: 8px 16px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
  opacity: 0; transition: all .2s;
  pointer-events: none; white-space: nowrap; z-index: 99;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── spinner ── */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid #ffffff44; border-top-color: #fff;
  border-radius: 50%; animation: spin .7s linear infinite; display: none;
}
.loading .spinner { display: block; }
.loading .btn-label { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .tipo-btn span.label { display: none; }
  .total-bar-value { font-size: 16px; }
}

/* ── voz ── */
.input-voz { display: flex; align-items: center; gap: 6px; }
.input-voz input { flex: 1; }
.btn-mic {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border-s);
  background: var(--bg);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .15s;
  padding: 0;
}
.btn-mic:hover { border-color: var(--accent); color: var(--accent); }
.btn-mic.escuchando {
  border-color: #DC2626;
  background: #FEE2E2;
  color: #DC2626;
  animation: pulso .8s ease-in-out infinite alternate;
}
@keyframes pulso {
  from { box-shadow: 0 0 0 0 #DC262640; }
  to   { box-shadow: 0 0 0 6px #DC262600; }
}
.voz-status { font-size: 11px; color: var(--muted); min-height: 16px; transition: color .2s; }
.voz-status.activo { color: #DC2626; font-weight: 500; }
.voz-ayuda {
  font-size: 10px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px; line-height: 1.6;
}

@media print {
  body { background: #fff !important; color: #000 !important; font-size: 11px; }
  .app { max-width: 100%; padding: 0; gap: 8px; }
  .header-actions, .card:first-of-type, #card-lista .card-head { display: none !important; }
  .card { border: none; box-shadow: none; }
  .cliente-pagos { display: block !important; }
  .chevron, .delete-btn { display: none; }
  .cliente-header { background: #f3f4f6 !important; padding: 5px 10px; }
  .pago-row { padding: 4px 10px; border-top: 1px solid #ddd; }
  .total-bar { background: #1D4ED8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .chip-ec { background: #FFFBEB !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .chip-tr { background: #EFF6FF !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .header-title { display: block !important; margin-bottom: 8px; }
  .fecha-global { display: none !important; }
}
</style>

            <span id="cliente-activo-nombre"></span>
            <button class="btn-cambiar-cliente" onclick="cambiarCliente()">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 0 1 9-3M11 6a5 5 0 0 1-9 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 2.5V5H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 9.5V7H5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
'use strict';

const STORE_KEY = 'pagos_santaana';

let pagos = [];
let tipo = 'tr';
let clienteActivo = null;

// ── localStorage ──────────────────────────────────────
function cargarDesdeStorage() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    pagos = raw ? JSON.parse(raw) : [];
  } catch(e) { pagos = []; }
}
function guardarEnStorage() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(pagos)); } catch(e) {}
}

// ── helpers ─────────────────────────────────────────
function fmt(n) {
  return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 }).format(n);
}
function fmtFecha(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function toast(msg, dur = 2400) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── cliente activo ───────────────────────────────────
function fijarCliente(nombre) {
  clienteActivo = nombre;
  document.getElementById('cliente-activo-nombre').textContent = nombre;
  document.getElementById('cliente-activo-bar').hidden = false;
  document.getElementById('fila-cliente').hidden = true;
  document.getElementById('fila-monto-solo').hidden = false;
  setTimeout(() => document.getElementById('inp-monto-solo').focus(), 50);
}

function cambiarCliente() {
  clienteActivo = null;
  document.getElementById('cliente-activo-bar').hidden = true;
  document.getElementById('fila-cliente').hidden = false;
  document.getElementById('fila-monto-solo').hidden = true;
  document.getElementById('inp-monto-solo').value = '';
  const inp = document.getElementById('inp-cliente');
  inp.value = '';
  setTimeout(() => inp.focus(), 50);
}

// ── tipo de comprobante ──────────────────────────────
function setTipo(t) {
  tipo = t;
  document.getElementById('btn-tipo-tr').classList.toggle('active', t === 'tr');
  document.getElementById('btn-tipo-ec').classList.toggle('active', t === 'ec');
  document.getElementById('echeq-extra').classList.toggle('visible', t === 'ec');
}

// ── datalist clientes ────────────────────────────────
function actualizarDatalist() {
  const dl = document.getElementById('clientes-list');
  const nombres = [...new Set(pagos.map(p => p.cliente).filter(Boolean))].sort();
  dl.innerHTML = nombres.map(n => `<option value="${n}">`).join('');
}

// ── agregar pago ─────────────────────────────────────
async function agregarPago() {
  let cliente = clienteActivo;
  let montoStr, monto;

  if (clienteActivo) {
    montoStr = document.getElementById('inp-monto-solo').value.trim();
  } else {
    cliente = document.getElementById('inp-cliente').value.trim();
    montoStr = document.getElementById('inp-monto').value.trim();
  }
  monto = parseFloat(montoStr);

  if (!cliente) { toast('⚠️ Ingresá el nombre del cliente'); return; }
  if (!montoStr || isNaN(monto) || monto <= 0) { toast('⚠️ Ingresá un monto válido'); return; }

  let nroCheq = '', fechaCheq = '';
  if (tipo === 'ec') {
    nroCheq = document.getElementById('inp-nro-cheq').value.trim();
    fechaCheq = document.getElementById('inp-fecha-cheq').value;
    if (!nroCheq) { toast('⚠️ Ingresá el número de cheque'); return; }
    if (!fechaCheq) { toast('⚠️ Ingresá la fecha de pago del cheque'); return; }
  }

  const btn = document.getElementById('btn-agregar');
  btn.classList.add('loading');
  btn.disabled = true;

  pagos.push({ id: uid(), cliente, monto, tipo, nroCheq, fechaCheq, ts: Date.now() });
  guardarEnStorage();
  renderLista();
  actualizarDatalist();

  if (clienteActivo) {
    document.getElementById('inp-monto-solo').value = '';
    document.getElementById('inp-nro-cheq').value = '';
    document.getElementById('inp-fecha-cheq').value = '';
    setTimeout(() => document.getElementById('inp-monto-solo').focus(), 50);
  } else {
    fijarCliente(cliente);
    document.getElementById('inp-monto').value = '';
    document.getElementById('inp-nro-cheq').value = '';
    document.getElementById('inp-fecha-cheq').value = '';
  }
  toast('✓ Pago agregado');

  btn.classList.remove('loading');
  btn.disabled = false;
}

// ── eliminar pago ─────────────────────────────────────
function eliminarPago(id) {
  pagos = pagos.filter(p => p.id !== id);
  guardarEnStorage();
  renderLista();
  toast('Pago eliminado');
}

// ── render ────────────────────────────────────────────
function renderLista() {
  const cont = document.getElementById('lista-contenido');
  const titulo = document.getElementById('lista-titulo');

  if (!pagos.length) {
    cont.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="5" y="8" width="30" height="24" rx="3" stroke="currentColor" stroke-width="2"/><path d="M13 16h14M13 22h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <p>Todavía no hay pagos cargados.<br>Usá el formulario de arriba para agregar el primero.</p>
    </div>`;
    titulo.textContent = 'Pagos registrados';
    return;
  }

  const grupos = {};
  for (const p of pagos) {
    if (!grupos[p.cliente]) grupos[p.cliente] = [];
    grupos[p.cliente].push(p);
  }
  const clientesOrdenados = Object.keys(grupos).sort((a,b) => a.localeCompare(b,'es'));
  const totalGeneral = pagos.reduce((s, p) => s + p.monto, 0);
  titulo.textContent = `${pagos.length} pago${pagos.length !== 1 ? 's' : ''} · ${clientesOrdenados.length} cliente${clientesOrdenados.length !== 1 ? 's' : ''}`;

  let html = `<div class="pagos-list">`;
  for (const cliente of clientesOrdenados) {
    const filas = grupos[cliente];
    const totalCliente = filas.reduce((s, p) => s + p.monto, 0);
    html += `<div class="cliente-group" id="grupo-${esc(cliente)}">
      <div class="cliente-header" onclick="toggleGrupo('${esc(cliente)}')">
        <div class="cliente-name">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3.31 2.686-6 6-6s6 2.69 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          ${esc(cliente)}
          <span style="color:var(--muted);font-weight:400;font-size:11px;">(${filas.length})</span>
          ${filas.some(p => p.tipo === 'ec') ? `<span class="chip chip-ec" style="font-size:10px;padding:1px 5px;">E-Cheq</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="cliente-total">${fmt(totalCliente)}</div>
          <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="cliente-pagos">`;
    for (const p of filas) {
      const esEC = p.tipo === 'ec';
      html += `<div class="pago-row">
        <span class="chip ${esEC ? 'chip-ec' : 'chip-tr'}">
          ${esEC
            ? `<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x=".5" y="2" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/><path d=".5 4.5h10" stroke="currentColor" stroke-width="1.2"/></svg> E-Cheq`
            : `<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5h9M6.5 2l3 3.5-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Transf./Dep.`}
        </span>
        ${esEC ? `<div class="pago-meta"><span>Cheq #${esc(p.nroCheq)}</span><span>Pago: ${fmtFecha(p.fechaCheq)}</span></div>` : `<div class="pago-meta"></div>`}
        <div class="pago-monto">${fmt(p.monto)}</div>
        <button class="delete-btn" onclick="eliminarPago('${esc(p.id)}')" title="Eliminar">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M5 3.5V2.5h4v1M5.5 6v4M8.5 6v4M3 3.5l.7 7.5h6.6L11 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>`;
    }
    html += `</div></div>`;
  }
  html += `</div>
  <div class="total-bar" style="margin:12px;border-radius:8px;">
    <div>
      <div class="total-bar-label">Total general</div>
      <div style="font-size:11px;opacity:.7;">${pagos.length} pago${pagos.length!==1?'s':''}</div>
    </div>
    <div class="total-bar-value">${fmt(totalGeneral)}</div>
  </div>`;
  cont.innerHTML = html;
}

function toggleGrupo(cliente) {
  const el = document.getElementById('grupo-' + cliente);
  if (el) el.classList.toggle('open');
}

// ── fecha de hoy ─────────────────────────────────────
(function() {
  const hoy = new Date();
  const yyyy = hoy.getFullYear();
  const mm = String(hoy.getMonth()+1).padStart(2,'0');
  const dd = String(hoy.getDate()).padStart(2,'0');
  const inp = document.getElementById('inp-fecha-global');
  inp.value = `${yyyy}-${mm}-${dd}`;
  inp.dataset.prev = inp.value;
})();

// ── cambiar fecha ─────────────────────────────────────
function cambiarFecha(input) {
  if (!pagos.length) { input.dataset.prev = input.value; return; }
  const nueva = input.value;
  const confirma = confirm(`¿Cambiás la fecha a ${fmtFecha(nueva)}?\nSe van a borrar los ${pagos.length} pago${pagos.length!==1?'s':''} cargados y empezás de cero.`);
  if (!confirma) { input.value = input.dataset.prev || ''; return; }
  pagos = [];
  guardarEnStorage();
  renderLista();
  cambiarCliente();
  input.dataset.prev = nueva;
  toast('✓ Fecha cambiada · pagos borrados');
}

// ── exportar excel ────────────────────────────────────
async function exportarExcel() {
  if (!pagos.length) { toast('No hay pagos para exportar'); return; }
  const btn = document.getElementById('btn-export');
  btn.disabled = true;

  const fechaVal = document.getElementById('inp-fecha-global').value;
  const fechaLabel = fechaVal ? fmtFecha(fechaVal) : 'Sin fecha';
  const nombreArchivo = fechaVal ? `pagos_${fechaVal}.xlsx` : 'pagos_clientes.xlsx';

  const grupos = {};
  for (const p of pagos) {
    if (!grupos[p.cliente]) grupos[p.cliente] = [];
    grupos[p.cliente].push(p);
  }
  const clientesOrdenados = Object.keys(grupos).sort((a,b) => a.localeCompare(b,'es'));

  const wb = new ExcelJS.Workbook();
  const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
  const borders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };
  const fillAmarillo = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
  const fillCabecera = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4472C4' } };
  const fuenteBlanca = { color: { argb: 'FFFFFFFF' }, bold: true };
  const fuenteNegrita = { bold: true };
  function aplicarBorde(c) { c.border = borders; }
  function pintarAmarillo(c) { c.fill = fillAmarillo; c.font = fuenteNegrita; aplicarBorde(c); }

  // Hoja Resumen
  const wsR = wb.addWorksheet('Resumen por cliente');
  wsR.columns = [
    { key:'a', width:30 }, { key:'b', width:18 }, { key:'c', width:18 },
    { key:'d', width:16 }, { key:'e', width:20 },
  ];
  wsR.addRow([`Fecha: ${fechaLabel}`]).font = { italic: true, color: { argb: 'FF555555' } };
  const rHead = wsR.addRow(['Cliente','Tipo','Total ($)','Nro Cheque','Fecha Pago Cheq']);
  rHead.eachCell(c => { c.fill = fillCabecera; c.font = fuenteBlanca; c.border = borders; c.alignment = { horizontal:'center' }; });
  const fillEC = { type:'pattern', pattern:'solid', fgColor: { argb:'FFFFF3CD' } };

  for (const cl of clientesOrdenados) {
    const filas = grupos[cl];
    const totalCl = filas.reduce((s,p) => s+p.monto, 0);
    const tieneEC = filas.some(p => p.tipo === 'ec');
    const cheques = filas.filter(p => p.tipo === 'ec');
    const row = wsR.addRow([cl, tieneEC ? 'Transf. + E-Cheq' : 'Transf./Dep.', totalCl, '', '']);
    row.getCell(3).numFmt = '#,##0.00';
    row.eachCell(aplicarBorde);
    for (const cheq of cheques) {
      const rEC = wsR.addRow(['','E-Cheq',cheq.monto,cheq.nroCheq||'',cheq.fechaCheq?fmtFecha(cheq.fechaCheq):'']);
      rEC.getCell(3).numFmt = '#,##0.00';
      rEC.eachCell(c => { c.fill = fillEC; c.border = borders; c.font = { italic:true }; });
    }
  }
  const rTotalR = wsR.addRow(['TOTAL GENERAL','',pagos.reduce((s,p)=>s+p.monto,0),'','']);
  rTotalR.getCell(3).numFmt = '#,##0.00';
  rTotalR.eachCell(pintarAmarillo);

  // Hoja Detalle
  const wsD = wb.addWorksheet('Detalle completo');
  wsD.columns = [
    { key:'a', width:28 }, { key:'b', width:18 }, { key:'c', width:18 },
    { key:'d', width:16 }, { key:'e', width:22 },
  ];
  wsD.addRow([`Fecha: ${fechaLabel}`]).font = { italic:true, color: { argb:'FF555555' } };
  for (const cl of clientesOrdenados) {
    const filas = grupos[cl];
    const totalCl = filas.reduce((s,p)=>s+p.monto,0);
    const rCl = wsD.addRow([cl.toUpperCase(),'TOTAL',totalCl,'','']);
    rCl.getCell(3).numFmt = '#,##0.00';
    rCl.eachCell(pintarAmarillo);
    for (const p of filas) {
      const rP = wsD.addRow(['',p.tipo==='ec'?'E-Cheq':'Transf./Dep.',p.monto,p.nroCheq||'',p.fechaCheq?fmtFecha(p.fechaCheq):'']);
      rP.getCell(3).numFmt = '#,##0.00';
      rP.eachCell(aplicarBorde);
    }
    wsD.addRow([]);
  }
  const rTotalD = wsD.addRow(['TOTAL GENERAL','',pagos.reduce((s,p)=>s+p.monto,0),'','']);
  rTotalD.getCell(3).numFmt = '#,##0.00';
  rTotalD.eachCell(pintarAmarillo);

  // descargar directo (sin claude.use)
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  toast('✓ Excel descargado');
  btn.disabled = false;
}

// ── exportar PDF ──────────────────────────────────────
function exportarPDF() {
  if (!pagos.length) { toast('No hay pagos para exportar'); return; }
  document.querySelectorAll('.cliente-group').forEach(g => g.classList.add('open'));
  window.print();
}

// ── enter para agregar ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT'
      && document.activeElement.id !== 'inp-fecha-global') {
    agregarPago();
  }
});

// ── dictado por voz ──────────────────────────────────
(function() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  let recog = null;
  let modoActual = null;

  function palabrasANumero(str) {
    const MAP = {
      cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,
      seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,
      trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,
      dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,
      veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,
      veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,
      cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,
      noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,
      cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,
      ochocientos:800,novecientos:900,mil:1000,millon:1000000
    };
    const plain = str.replace(/[.,\s]/g,'');
    if (!isNaN(plain) && plain !== '') return parseFloat(str.replace(',','.'));
    let s = str.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/\bmillones\b/g,'millon').replace(/\bmiles\b/g,'mil').replace(/\by\b/g,' ');
    const tokens = s.split(/\s+/).filter(Boolean);
    let total=0, current=0;
    for (const t of tokens) {
      const v=MAP[t]; if(v===undefined) continue;
      if(v===1000000){current=current||1;total+=current*v;current=0;}
      else if(v===1000){current=current||1;total+=current*1000;current=0;}
      else if(v>=100){current=(current||1)*v;}
      else{current+=v;}
    }
    total+=current;
    return total>0?total:NaN;
  }

  function detenerDictado() {
    if (recog) { try { recog.stop(); } catch(e){} recog = null; }
    modoActual = null;
    document.getElementById('mic-cliente').classList.remove('escuchando');
    document.getElementById('mic-monto').classList.remove('escuchando');
    document.getElementById('voz-panel').hidden = true;
    document.getElementById('voz-status').className = 'voz-status';
    document.getElementById('voz-status').textContent = '';
    document.getElementById('voz-ayuda').textContent = '';
  }

  function setStatus(msg, activo) {
    const el = document.getElementById('voz-status');
    el.textContent = msg;
    el.className = 'voz-status' + (activo ? ' activo' : '');
  }

  function mostrarAyuda(modo) {
    document.getElementById('voz-panel').hidden = false;
    const el = document.getElementById('voz-ayuda');
    if (modo === 'cliente') {
      el.innerHTML = '🎤 Decí el nombre del cliente — se cargará automáticamente';
    } else {
      el.innerHTML = '🎤 Decí el monto · Di <b>"enter"</b> para agregar · Di <b>"cambiar cliente"</b> para cambiar';
    }
  }

  function crearRecog() {
    const r = new SR();
    r.lang = 'es-AR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    return r;
  }

  window.iniciarDictadoCliente = function() {
    if (modoActual === 'cliente') { detenerDictado(); return; }
    detenerDictado();
    modoActual = 'cliente';
    recog = crearRecog();
    document.getElementById('mic-cliente').classList.add('escuchando');
    mostrarAyuda('cliente');
    setStatus('🎤 Escuchando nombre…', true);
    recog.onresult = function(e) {
      let final = '';
      for (let i=e.resultIndex; i<e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
      }
      if (final.trim()) {
        const nombre = final.trim().replace(/\.$/, '');
        document.getElementById('inp-cliente').value = nombre;
        setStatus('✓ Cliente: ' + nombre, false);
        detenerDictado();
        setTimeout(() => {
          fijarCliente(nombre);
          setTimeout(() => iniciarDictadoMonto(), 300);
        }, 200);
      }
    };
    recog.onerror = function(e) {
      if (e.error === 'not-allowed') toast('⚠️ Permiso de micrófono denegado');
      else if (e.error !== 'no-speech') toast('Error de voz: ' + e.error);
      detenerDictado();
    };
    recog.onend = function() { if (modoActual === 'cliente') detenerDictado(); };
    try { recog.start(); } catch(err) { toast('No se pudo iniciar el micrófono'); detenerDictado(); }
  };

  window.iniciarDictadoMonto = function() {
    if (modoActual === 'monto') { detenerDictado(); return; }
    detenerDictado();
    modoActual = 'monto';
    recog = crearRecog();
    document.getElementById('mic-monto').classList.add('escuchando');
    mostrarAyuda('monto');
    setStatus('🎤 Escuchando monto…', true);
    recog.onresult = function(e) {
      let final = '';
      for (let i=e.resultIndex; i<e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript.toLowerCase();
      }
      if (!final.trim()) return;
      if (/cambiar\s*cliente/.test(final)) {
        detenerDictado(); cambiarCliente();
        setTimeout(() => iniciarDictadoCliente(), 300); return;
      }
      const tieneEnter = /\b(enter|siguiente|listo|ok)\b/.test(final);
      const sinComando = final.replace(/\b(enter|siguiente|listo|ok)\b/g,' ').trim();
      const num = palabrasANumero(sinComando);
      if (!isNaN(num) && num > 0) {
        document.getElementById('inp-monto-solo').value = num;
        setStatus('✓ $ ' + fmt(num), false);
        if (tieneEnter) {
          setTimeout(async () => { await agregarPago(); setStatus('🎤 Escuchando próximo monto…', true); }, 150);
        }
      } else if (tieneEnter) {
        const campo = document.getElementById('inp-monto-solo');
        if (campo.value) {
          setTimeout(async () => { await agregarPago(); setStatus('🎤 Escuchando próximo monto…', true); }, 150);
        }
      }
    };
    recog.onerror = function(e) {
      if (e.error === 'not-allowed') toast('⚠️ Permiso de micrófono denegado');
      else if (e.error !== 'no-speech') toast('Error de voz: ' + e.error);
      detenerDictado();
    };
    recog.onend = function() {
      if (modoActual === 'monto' && recog) {
        try { recog.start(); } catch(e) { detenerDictado(); }
      }
    };
    try { recog.start(); } catch(err) { toast('No se pudo iniciar el micrófono'); detenerDictado(); }
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modoActual) detenerDictado();
  });
})();

// ── inicio ────────────────────────────────────────────
cargarDesdeStorage();
renderLista();
actualizarDatalist();
</script>
